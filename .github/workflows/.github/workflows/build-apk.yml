name: Build SonyStyle Equalizer APK

'on': [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/project
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip "$ZIP" -d /tmp/project
          ROOT=$(find /tmp/project -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$ROOT"
          cp -a "$ROOT"/. .

            - name: Add Sony groove control
        run: |
          mkdir -p app/src/main/java/com/sonyericsson/music
          cat > app/src/main/java/com/sonyericsson/music/EqualizerGrooveView.java <<'EOF'
          package com.sonyericsson.music;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import android.view.View;

          public class EqualizerGrooveView extends View {
              private final Paint paint = new Paint(3);
              private int level = 10;
              private boolean horizontal;

              public EqualizerGrooveView(Context c, AttributeSet a) {
                  super(c, a);
              }

              @Override
              protected void onDraw(Canvas c) {
                  super.onDraw(c);
                  horizontal = getWidth() > getHeight();
                  float w = getWidth(), h = getHeight();
                  for (int i = 0; i < 20; i++) {
                      paint.setColor(i < level ? 0xff168cff : 0xff777777);
                      if (horizontal) {
                          float x = (i + 0.5f) * w / 20;
                          c.drawRoundRect(x - 5, h/2 - 2, x + 5, h/2 + 2, 2, 2, paint);
                      } else {
                          float y = h - (i + 0.5f) * h / 20;
                          c.drawRoundRect(w/2 - 5, y - 2, w/2 + 5, y + 2, 2, 2, paint);
                      }
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (e.getAction() == MotionEvent.ACTION_DOWN ||
                      e.getAction() == MotionEvent.ACTION_MOVE ||
                      e.getAction() == MotionEvent.ACTION_UP) {
                      float p = getWidth() > getHeight()
                          ? e.getX() / getWidth()
                          : 1f - e.getY() / getHeight();
                      level = Math.max(0, Math.min(20, (int)(p * 20)));
                      invalidate();
                      return true;
                  }
                  return true;
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonyStyleEqualizer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
