name: Build SonyStyle Equalizer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/project
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip "$ZIP" -d /tmp/project
          ROOT=$(find /tmp/project -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$ROOT"
          cp -a "$ROOT"/. .

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonyStyleEqualizer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
