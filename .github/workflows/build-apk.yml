name: Build SonyStyle Equalizer APK

'on': [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/project
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip "$ZIP" -d /tmp/project
          ROOT=$(find /tmp/project -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$ROOT"
          cp -a "$ROOT"/. .
      - name: Add Sony groove control
        run: |
          mkdir -p app/src/main/java/com/sonyericsson/music
          cat > app/src/main/java/com/sonyericsson/music/EqualizerGrooveView.java <<'EOF'
          package com.sonyericsson.music;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import android.view.View;

          public class EqualizerGrooveView extends View {
              private final Paint paint = new Paint(3);
              private int level = 0;

              public EqualizerGrooveView(Context c, AttributeSet a) {
                  super(c, a);
              }

              @Override
              protected void onDraw(Canvas c) {
                  super.onDraw(c);

                  float w = getWidth();
                  float h = getHeight();
                  boolean horizontal = w > h;

                  paint.setStrokeWidth(3);

                  for (int i = 0; i < 20; i++) {
                      paint.setColor(0xff999999);

                      if (horizontal) {
                          float x = (i + 0.5f) * w / 20;
                          c.drawLine(x - 4, h / 2, x + 4, h / 2, paint);
                      } else {
                          float y = (i + 0.5f) * h / 20;
                          c.drawLine(w / 2 - 4, y, w / 2 + 4, y, paint);
                      }
                  }

                  paint.setColor(0xffb49a55);
                  paint.setStrokeWidth(5);

                  if (horizontal) {
                      float x = (level + 10) * w / 20;
                      c.drawLine(x, h / 2 - 9, x, h / 2 + 9, paint);
                  } else {
                      float y = (10 - level) * h / 20;
                      c.drawLine(w / 2 - 12, y, w / 2 + 12, y, paint);
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (e.getAction() == MotionEvent.ACTION_DOWN ||
                      e.getAction() == MotionEvent.ACTION_MOVE ||
                      e.getAction() == MotionEvent.ACTION_UP) {

                      if (getWidth() > getHeight()) {
                          level = Math.round(e.getX() * 20 / getWidth()) - 10;
                      } else {
                          level = 10 - Math.round(e.getY() * 20 / getHeight());
                      }

                      level = Math.max(-10, Math.min(10, level));
                      invalidate();
                      return true;
                  }
                  return true;
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonyStyleEqualizer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
