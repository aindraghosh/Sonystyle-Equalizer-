
name: Build SonyStyle Equalizer APK

'on': [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/project
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip "$ZIP" -d /tmp/project
          ROOT=$(find /tmp/project -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$ROOT"
          cp -a "$ROOT"/. .

      - name: Add Sony groove control
        run: |
          mkdir -p app/src/main/java/com/sonyericsson/music
          cat > app/src/main/java/com/sonyericsson/music/EqualizerGrooveView.java <<'EOF'
          package com.sonyericsson.music;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import android.view.View;

          public class EqualizerGrooveView extends View {

              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private int level = 0;

              private static final int BLUE = 0xff168cff;
              private static final int GREY = 0xff999999;
              private static final int GOLD = 0xffb49a55;

              public EqualizerGrooveView(Context c, AttributeSet a) {
                  super(c, a);
              }

              public void setLevel(int value) {
                  level = Math.max(-10, Math.min(10, value));
                  invalidate();
              }

              public int getLevel() {
                  return level;
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);

                  float w = getWidth();
                  float h = getHeight();
                  boolean horizontal = w > h;

                  float center = horizontal ? w / 2f : h / 2f;
                  float spacing = horizontal ? w / 20f : h / 20f;

                  paint.setTextSize(11f);
                  paint.setTypeface(Typeface.DEFAULT_BOLD);
                  paint.setColor(GREY);

                  if (horizontal) {
                      canvas.drawText("-10", 2, 12, paint);
                      canvas.drawText("+10", w - 23, 12, paint);
                  } else {
                      canvas.drawText("+10", 3, 13, paint);
                      canvas.drawText("0", 3, center + 4, paint);
                      canvas.drawText("-10", 3, h - 3, paint);
                  }

                  paint.setStrokeCap(Paint.Cap.BUTT);
                  paint.setStrokeWidth(4f);

                  for (int i = 0; i < 20; i++) {
                      int grooveLevel = i < 10 ? 10 - i : -(i - 9);

                      boolean active = level > 0
                              ? grooveLevel > 0 && grooveLevel <= level
                              : level < 0 && grooveLevel < 0
                              && grooveLevel >= level;

                      paint.setColor(active ? BLUE : GREY);

                      if (horizontal) {
                          float x = (i + 0.5f) * w / 20f;
                          canvas.drawLine(x - 5, center, x + 5, center, paint);
                      } else {
                          float y = (i + 0.5f) * h / 20f;
                          canvas.drawLine(w / 2f - 5, y, w / 2f + 5, y, paint);
                      }
                  }

                  // Fixed zero marker
                  paint.setColor(GREY);
                  paint.setStrokeWidth(5f);

                  if (horizontal) {
                      canvas.drawLine(center, h / 2f - 9,
                              center, h / 2f + 9, paint);
                  } else {
                      canvas.drawLine(w / 2f - 10, center,
                              w / 2f + 10, center, paint);
                  }

                  // Moving marker
                  paint.setColor(GOLD);
                  paint.setStrokeWidth(9f);

                  if (horizontal) {
                      float x = center + level * spacing;
                      canvas.drawLine(x, h / 2f - 12,
                              x, h / 2f + 12, paint);
                  } else {
                      float y = center - level * spacing;
                      canvas.drawLine(w / 2f - 13, y,
                              w / 2f + 13, y, paint);
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent event) {
                  if (event.getAction() == MotionEvent.ACTION_DOWN
                          || event.getAction() == MotionEvent.ACTION_MOVE
                          || event.getAction() == MotionEvent.ACTION_UP) {

                      if (getWidth() > getHeight()) {
                          level = Math.round(
                                  (event.getX() - getWidth() / 2f)
                                  * 20f / getWidth());
                      } else {
                          level = Math.round(
                                  (getHeight() / 2f - event.getY())
                                  * 20f / getHeight());
                      }

                      level = Math.max(-10, Math.min(10, level));
                      invalidate();
                      return true;
                  }

                  return true;
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonyStyleEqualizer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
